[tools]
swift = "6.4.0"
swiftformat = "0.63.1"
swiftlint = "0.65.1"
tmux = "3.7b" # integration tests
zig = "0.16.0" # builds upstream ghostty-bench for comparison
"cargo:hyperfine" = "1.20.0" # native arm64 build; release binary is x86_64-only

[env]
# swift.org toolchains need the macOS SDK from Xcode / CLT to link.
SDKROOT = "{{exec(command='xcrun --sdk macosx --show-sdk-path')}}"

[tasks.build]
description = "Build SwifttyCore and the app (debug)"
run = "swift build"

[tasks.release]
description = "Build everything (release)"
run = "swift build -c release"

[tasks.test]
description = "Run unit + integration tests"
run = "Scripts/test.sh"

[tasks.test-native]
description = "Run the full suite with the native test bundle host"
run = "Scripts/test-native.sh"

[tasks.bench]
description = "Run microbenchmarks on a release build"
run = "swift run -c release swiftty-bench"

[tasks.app]
description = "Launch the swiftty macOS app"
run = "swift run -c release swiftty"

[tasks.package-swiftmux]
description = "Assemble and sign Swiftty.app with the SwiftMux agent: mise run package-swiftmux [identity]"
run = "Scripts/package-swiftmux.sh"

[tasks.install]
description = "Install Swiftty.app, register the SwiftMux agent; --roaming adds swifttyd: mise run install [options]"
run = "Scripts/install.sh"

[tasks.uninstall]
description = "Remove Swiftty.app, the SwiftMux agent and swifttyd: mise run uninstall [--purge] [-y]"
run = "Scripts/uninstall.sh"

[tasks.bench-swiftmux]
description = "SwiftMux throughput, latency, CPU, memory and GPU measurements"
run = "swift run -c release swiftmux-bench"

[tasks.unicode]
description = "Regenerate Unicode width tables"
run = "Scripts/update-unicode-tables.sh"

[tasks.graphemes]
description = "Regenerate grapheme property tables and conformance test data from a UCD directory"
run = "Scripts/update-grapheme-tables.sh"

[tasks.format]
description = "Format sources"
run = "Scripts/format-swift.sh"

[tasks.lint]
description = "Lint sources"
run = "swiftlint lint --quiet Sources Tests"

[tasks.compare]
description = "Compare against upstream ghostty-bench: mise run compare <ghostty-src> <corpus-dir>"
depends = ["release"]
run = "Scripts/compare-ghostty.sh"

[tasks.format-check]
description = "Check Swift formatting and documentation"
run = "Scripts/format-swift.sh check"

[tasks.test-internal]
description = "Run tests with storage and terminal invariant checks"
run = "Scripts/test.sh -Xswiftc -DSWIFTTY_INTERNAL_CHECKS"

[tasks.bench-storage]
description = "Measure storage operation scaling"
run = "swift run -c release swiftty-bench --only storage"
